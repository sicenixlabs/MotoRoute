name: Build MotoRuta Mobile Apps (Android APK/AAB)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android APK & AAB (Ubuntu Free Runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Prepare Web Assets & Select Newest HTML Automatically
        run: |
          mkdir -p www
          BEST_FILE=""
          # 1. Priorizar el archivo que tenga el buscador de rutas y clima en vivo (V5 / fetchLiveRiderWeather)
          for f in biker_app_prototype.html index.html www/index.html app/src/main/assets/www/index.html; do
            if [ -f "$f" ] && grep -q "fetchLiveRiderWeather" "$f"; then
              BEST_FILE="$f"
              break
            fi
          done
          # 2. Si no, elegir el archivo modificado en el commit más reciente (o el más grande)
          if [ -z "$BEST_FILE" ]; then
            BEST_SCORE=0
            for f in biker_app_prototype.html index.html www/index.html app/src/main/assets/www/index.html; do
              if [ -f "$f" ]; then
                SZ=$(wc -c < "$f" 2>/dev/null || echo 0)
                if [ "$SZ" -gt "$BEST_SCORE" ]; then
                  BEST_SCORE="$SZ"
                  BEST_FILE="$f"
                fi
              fi
            done
          fi
          if [ -n "$BEST_FILE" ]; then
            echo "✅ Usando el archivo HTML más actualizado: $BEST_FILE"
            cp "$BEST_FILE" www/index.html
            cp "$BEST_FILE" index.html || true
            cp "$BEST_FILE" biker_app_prototype.html || true
          fi
          npm install --legacy-peer-deps
          npm uninstall @capacitor-community/keep-awake --legacy-peer-deps || true
          find node_modules -name "build.gradle" -exec sed -i 's/VERSION_21/VERSION_17/g' {} + || true
          rm -rf android
          npx cap add android
          npx cap copy android

      - name: Inject Native Android GPS Permissions & WebView Cache Buster
        run: |
          cat << 'MANIFEST_EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

          MAIN_ACT_FILE=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACT_FILE" ]; then
            PKG_LINE=$(grep "^package " "$MAIN_ACT_FILE" | head -n 1)
            cat << JAVA_EOF > "$MAIN_ACT_FILE"
          $PKG_LINE

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          this.bridge.getWebView().clearCache(true);
                          this.bridge.getWebView().clearHistory();
                          this.bridge.getWebView().getSettings().setCacheMode(WebSettings.LOAD_NO_CACHE);
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          }, 1001);
                      }
                  }
              }
          }
          JAVA_EOF
          fi
          npx cap sync android
          find android node_modules -name "build.gradle" -exec sed -i 's/VERSION_21/VERSION_17/g' {} + || true

      - name: Build Installable APK & Play Store AAB
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload Android APK (Install on Phone) & AAB
        uses: actions/upload-artifact@v4
        with:
          name: motoruta-android-apk-instalable
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
