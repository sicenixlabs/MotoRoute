name: Compilar MotoRuta (.APK Android + GitHub Pages HTTPS)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "production" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-android-apk:
    name: "🤖 1. Compilar Instalador MotoRuta-3Telefonos.apk"
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java JDK 21 (Temurin para Capacitor 6 / Gradle 8)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Auto-generar estructura Capacitor 6 y Plataforma Android
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "biker_app_prototype.html" ]; then
            cp biker_app_prototype.html www/index.html
          else
            echo "ERROR: Subi el archivo index.html a la raiz del repositorio"
            exit 1
          fi
          cat << 'EOF_PKG' > package.json
          {
            "name": "motoruta-mobile-production",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.1.2",
              "@capacitor/android": "^6.1.2",
              "@capacitor/geolocation": "^6.0.1"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2"
            }
          }
          EOF_PKG
          cat << 'EOF_CAP' > capacitor.config.json
          {
            "appId": "ar.com.motoruta.app",
            "appName": "MotoRuta",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF_CAP
          npm install --legacy-peer-deps
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Compilar archivo instalable MotoRuta-3Telefonos.apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MotoRuta-3Telefonos.apk

      - name: Publicar MotoRuta-3Telefonos.apk en Artifacts para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: MotoRuta-Instalador-Android-APK
          path: MotoRuta-3Telefonos.apk
          if-no-files-found: error
